name: Main Site Deploy

# Deploys main-branch artifacts to permanent apex subdomains:
#   main.preview.wod.wiki  → playground  (s3://bucket/main/dist/)
#   story.wod.wiki         → storybook   (s3://bucket/main/storybook/)
#   e2e.wod.wiki           → E2E report  (s3://bucket/main/e2e-report/)
#
# Differs from preview-deploy.yml (PR-scoped, {slug}-prefixed) in that this
# workflow always publishes under the "main" prefix at the apex of each
# artifact subdomain. No teardown — these are permanent deployments.
#
# No `environment:` directive: main merges are already reviewed via PR, so
# requiring a manual deploy approval would block automation. Preview secrets
# are repo-scoped ( propagated by wod-wiki-iac cfn-deploy.yml), accessible
# without an environment binding.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: none

env:
  BUN_VERSION: "1.3.x"

jobs:
  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build main artifacts
    runs-on: ubuntu-22.04
    outputs:
      bundle-hash: ${{ steps.fingerprint.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # main's playground is served at main.preview.wod.wiki. VITE_BASE_PATH
      # matches the CF function's "already prefixed" pass-through for asset URLs.
      - name: Build playground
        env:
          VITE_BASE_PATH: /main/dist/
        run: |
          bun run build-playground
          VITE_BASE_PATH="/main/dist/" \
            bun x vite build --config vite.receiver.config.ts

      # Storybook default basePath=/ works: CF host-header function injects
      # /main/storybook/ under the hood for story.wod.wiki requests.
      - name: Build Storybook
        run: bun run build-storybook

      # Fingerprint of this build's hashed entry bundle. The e2e job polls
      # the deployed index.html until it references THIS hash — proof the
      # current build (not a stale CloudFront cache) is being tested.
      - name: Compute build fingerprint
        id: fingerprint
        run: |
          HASH=$(ls playground/dist/assets/main-*.js | head -n1 | sed -E 's/.*main-([^.]+)\.js/\1/')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Persist playground artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-build-${{ github.run_id }}
          path: playground/dist/
          retention-days: 1

      - name: Persist Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-storybook-${{ github.run_id }}
          path: storybook-static/
          retention-days: 1

  # ── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy main to S3
    runs-on: ubuntu-22.04
    needs: build
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PREVIEW_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PREVIEW_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${{ secrets.AWS_PREVIEW_S3_BUCKET }}
      CF_DISTRIBUTION_ID: ${{ secrets.AWS_PREVIEW_CF_DISTRIBUTION_ID }}
    steps:
      - name: Download playground artifact
        uses: actions/download-artifact@v4
        with:
          name: main-build-${{ github.run_id }}
          path: ./dist/

      - name: Download Storybook artifact
        uses: actions/download-artifact@v4
        with:
          name: main-storybook-${{ github.run_id }}
          path: ./storybook-static/
          if-no-files-found: error

      - name: Deploy playground (main.preview.wod.wiki)
        run: |
          set -euo pipefail
          echo "Uploading playground to s3://$S3_BUCKET/main/dist/"
          aws s3 sync ./dist/ "s3://$S3_BUCKET/main/dist/" \
            --delete \
            --cache-control "max-age=300, must-revalidate" \
            --exclude "*.map"

      - name: Deploy Storybook (story.wod.wiki)
        run: |
          set -euo pipefail
          echo "Uploading Storybook to s3://$S3_BUCKET/main/storybook/"
          aws s3 sync ./storybook-static/ "s3://$S3_BUCKET/main/storybook/" \
            --delete \
            --cache-control "max-age=300, must-revalidate" \
            --exclude "*.map"

      - name: Invalidate CloudFront cache (best-effort)
        # Same rationale as preview-deploy.yml: invalidation is non-critical
        # because --cache-control max-age=300 bounds staleness to 5 minutes.
        continue-on-error: true
        run: |
          set -uo pipefail
          if aws cloudfront create-invalidation \
               --distribution-id "$CF_DISTRIBUTION_ID" \
               --paths "/main/*"; then
            echo "CloudFront invalidation submitted for /main/*"
          else
            echo "::warning::CloudFront invalidation failed; S3 sync succeeded and cache will refresh within 5 minutes via max-age."
          fi

  # ── E2E against main.preview.wod.wiki; report publishes to e2e.wod.wiki ───
  e2e:
    name: Main E2E
    needs: [build, deploy]
    uses: ./.github/workflows/preview-e2e.yml
    secrets: inherit
    with:
      preview-url: https://main.preview.wod.wiki
      branch-slug: main
      build-hash: ${{ needs.build.outputs.bundle-hash }}

  # ── Summary ────────────────────────────────────────────────────────────────
  summary:
    name: Deploy summary
    runs-on: ubuntu-22.04
    if: always()
    needs: [build, deploy, e2e]
    steps:
      - name: Write summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Main site deploy

          | Target | URL | Status |
          | --- | --- | --- |
          | Playground | https://main.preview.wod.wiki | ${{ needs.deploy.result }} |
          | Storybook | https://story.wod.wiki | ${{ needs.deploy.result }} |
          | E2E report | https://e2e.wod.wiki | ${{ needs.e2e.outputs.outcome }} |

          > E2E: ${{ needs.e2e.outputs.tests }} tests, ${{ needs.e2e.outputs.failures }} failures.
          EOF
