name: Promote – Main to Prod

on:
  workflow_dispatch:
    inputs:
      sync_main:
        description: 'Sync main to match prod HEAD after merge (prevents future merge conflicts)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  promote:
    name: Promote main to prod & sync
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into prod
        run: |
          git checkout prod
          git pull origin prod
          git merge origin/main --no-ff -m "chore(release): promote main to prod" -X theirs || {
            git rm -rf .
            git checkout origin/main -- .
            git add -A
            git commit -m "chore(release): promote main to prod (resolved)"
          }
          git push origin prod

      - name: Sync prod merge commit back into main
        if: ${{ inputs.sync_main }}
        run: |
          git checkout main
          git pull origin main
          git merge origin/prod --no-edit -X ours || git merge origin/prod --ff-only
          git push origin main
