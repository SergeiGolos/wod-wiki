name: Verify

on:
  workflow_call:
    inputs:
      build-preview-artifact:
        description: Whether to run the deploy-shaped playground build gate and upload the dist artifact for the preview job (true on PRs; false on main — the site job builds for real)
        required: false
        type: boolean
        default: true
      preview-base-path:
        description: VITE_BASE_PATH for the deploy-shaped playground build gate (e.g. /<slug>/dist/ on PRs); empty = default '/'
        required: false
        type: string
        default: ''
      app-version:
        description: VITE_APP_VERSION stamped into the playground bundle (e.g. X.Y.Z-pr.N on PR previews); empty = package.json version
        required: false
        type: string
        default: ''
    outputs:
      unit-status:
        description: Unit test outcome
        value: ${{ jobs.verify.outputs.unit-status }}
      coverage-status:
        description: Coverage outcome
        value: ${{ jobs.verify.outputs.coverage-status }}
      build-status:
        description: Playground build outcome
        value: ${{ jobs.verify.outputs.build-status }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    outputs:
      unit-status: ${{ steps.unit.outcome }}
      coverage-status: ${{ steps.coverage.outcome }}
      build-status: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up environment (Bun + caches)
        uses: ./.github/actions/setup-env
        with:
          browsers: ''

      # App + playground unit tests only. Package and Storybook tests live in
      # the wod-wiki-engine repository; e2e runs post-deploy against the
      # published artifact (preview-e2e.yml) — never pre-deploy here.
      - name: Run unit tests
        id: unit
        run: bun run test

      - name: Run coverage
        id: coverage
        run: bun run test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always() && env.CODECOV_TOKEN != '' && steps.coverage.outcome == 'success'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # Deploy-shaped build gate (PRs only — on main the site job builds for
      # real, so a second smoke build is pure duplication). The preview job
      # downloads this artifact instead of building again.
      - name: Build playground
        id: build
        if: inputs.build-preview-artifact
        run: bun run build:app
        env:
          VITE_BASE_PATH: ${{ inputs.preview-base-path }}
          VITE_APP_VERSION: ${{ inputs.app-version }}
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://wod.wiki/api' }}
          VITE_CAST_APP_ID: ${{ vars.VITE_CAST_APP_ID }}

      - name: Upload playground dist
        if: inputs.build-preview-artifact && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: playground-dist
          path: playground/dist/
          retention-days: 1

      - name: Write verification summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Verification summary

          | Check | Outcome |
          | --- | --- |
          | Unit tests | ${{ steps.unit.outcome }} |
          | Coverage | ${{ steps.coverage.outcome }} |
          | Playground build | ${{ steps.build.outcome }} |
          EOF
