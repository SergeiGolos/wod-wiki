name: CI & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version override (e.g. 0.2.0)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Lint, Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Playwright browsers (for storybook browser runner)
        run: bun x playwright install chromium

      - name: Lint
        run: bun run lint

      - name: Build packages & Storybook
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Upload Storybook build artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/storybook/storybook-static/
          retention-days: 7

  # Compute next {major}.{minor}.{build} version from Conventional Commits
  version:
    name: Compute version
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            NEW_VERSION="${{ github.event.inputs.version }}"
            echo "Manual version: $NEW_VERSION"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "bump=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_TAG=$(git for-each-ref refs/tags \
            --sort=-v:refname \
            --format '%(refname:short)' \
            | grep -E '^v?[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            | head -1)

          if [ -n "$LATEST_TAG" ]; then
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            echo "Latest tag: $LATEST_TAG -> MAJOR=$MAJOR MINOR=$MINOR"
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --format="%s%n%b")
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            MAJOR=$(echo "$PKG_VERSION" | cut -d. -f1)
            MINOR=$(echo "$PKG_VERSION" | cut -d. -f2)
            echo "No tags; seeding from package.json: $PKG_VERSION -> MAJOR=$MAJOR MINOR=$MINOR"
            COMMITS=$(git log --format="%s%n%b")
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -qE "^(breaking[:(]|BREAKING CHANGE:)" || \
             echo "$COMMITS" | grep -qiE "^[a-z]+(\([^)]*\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^(feature[:(]|feat[:(])"; then
            BUMP="minor"
          fi
          echo "Detected bump: $BUMP"

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}"
          echo "New computed version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

  tag:
    name: Tag release
    runs-on: ubuntu-latest
    needs: [version]
    steps:
      - name: Create version tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (ref.data.object.sha === sha) {
                core.info(`Tag ${tag} already exists at this SHA; nothing to do.`);
                return;
              }
              core.setFailed(`Tag ${tag} already exists at ${ref.data.object.sha}, expected ${sha}.`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha,
            });
            core.info(`Created tag ${tag} at ${sha}.`);
        env:
          VERSION: ${{ needs.version.outputs.version }}

  publish-npm:
    name: Publish packages to npm
    needs: [version, tag]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js (for npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Stamp version on clean build
        run: bun scripts/stamp-version.ts --version "${{ needs.version.outputs.version }}"

      - name: Build packages
        run: bun run build

      - name: Publish packages to npm
        run: |
          for pkg in packages/*; do
            if [ -f "$pkg/package.json" ]; then
              echo "Publishing $pkg @ ${{ needs.version.outputs.version }} to npm..."
              (cd "$pkg" && npm publish --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-pages:
    name: Deploy Storybook to GitHub Pages
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Storybook build artifact
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: ./storybook-static

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./storybook-static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
