name: CI & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Playwright browsers (for storybook browser runner)
        run: bun x playwright install chromium

      - name: Lint
        run: bun run lint

      - name: Build packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Verify package tarballs
        run: |
          mkdir -p tarballs
          for pkg in packages/*; do
            if [ -f "$pkg/package.json" ]; then
              echo "Packing $pkg..."
              (cd "$pkg" && npm pack --pack-destination ../../tarballs)
            fi
          done
          ls -la tarballs/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-tarballs
          path: tarballs/*.tgz

  publish:
    name: Publish to npm
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js (for npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Build packages
        run: bun run build

      - name: Publish packages to npm
        run: |
          for pkg in packages/*; do
            if [ -f "$pkg/package.json" ]; then
              echo "Publishing $pkg to npm..."
              (cd "$pkg" && npm publish --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
