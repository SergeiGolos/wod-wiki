name: CI & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit semver to publish (e.g. 0.2.0)'
        required: false
        type: string
      prerelease:
        description: 'Stamp as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate:
    name: Lint, Build, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Install Playwright browsers (for storybook browser runner)
        run: bun x playwright install chromium

      - name: Stamp version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            bun scripts/stamp-version.ts --version "${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            bun scripts/stamp-version.ts --version "$TAG_VER"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            bun scripts/stamp-version.ts --prerelease pr.${{ github.event.pull_request.number }}
          fi

      - name: Lint
        run: bun run lint

      - name: Build packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Verify package tarballs
        run: |
          mkdir -p tarballs
          for pkg in packages/*; do
            if [ -f "$pkg/package.json" ]; then
              echo "Packing $pkg..."
              (cd "$pkg" && npm pack --pack-destination ../../tarballs)
            fi
          done
          ls -la tarballs/

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-tarballs
          path: tarballs/*.tgz

  publish:
    name: Publish to npm
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js (for npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Stamp version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            bun scripts/stamp-version.ts --version "${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VER="${GITHUB_REF#refs/tags/v}"
            bun scripts/stamp-version.ts --version "$TAG_VER"
          fi

      - name: Build packages
        run: bun run build

      - name: Publish packages to npm
        run: |
          for pkg in packages/*; do
            if [ -f "$pkg/package.json" ]; then
              echo "Publishing $pkg to npm..."
              (cd "$pkg" && npm publish --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
