name: Release

# Reusable production publication called by main.yml. Pull requests use the
# separate S3 preview workflow and never invoke this release path.

on:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute and set next version
        run: |
          LATEST_TAG=$(git for-each-ref refs/tags \
            --sort=-v:refname \
            --format '%(refname:short)' \
            | grep -E '^v?[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            | head -1)

          if [ -n "$LATEST_TAG" ]; then
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --format="%s%n%b")
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            MAJOR=$(echo "$PKG_VERSION" | cut -d. -f1)
            MINOR=$(echo "$PKG_VERSION" | cut -d. -f2)
            COMMITS=$(git log --format="%s%n%b")
          fi

          BUMP="patch"
          if echo "$COMMITS" | grep -qE "^(breaking[:(]|BREAKING CHANGE:)" || \
             echo "$COMMITS" | grep -qiE "^[a-z]+(\([^)]*\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^(feature[:(]|feat[:(])"; then
            BUMP="minor"
          fi

          if [ "$BUMP" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
          elif [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}"
          echo "Publishing version: $NEW_VERSION"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            pkg.version = '${NEW_VERSION}';
            fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\\n');
          "

      - name: Set up environment (Bun + caches + chromium)
        uses: ./.github/actions/setup-env

      - name: Replace GA tag in sources
        if: ${{ vars.G_TAG != '' }}
        run: |
          sed -i 's/G-PROD-ID/${{ vars.G_TAG }}/g' playground/index.html
          sed -i 's/G-PROD-ID/${{ vars.G_TAG }}/g' playground/receiver-rpc.html

      - name: Build playground
        run: bun run build:app
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://wod.wiki/api' }}
          VITE_CAST_APP_ID: ${{ vars.VITE_CAST_APP_ID }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Run production smoke tests
        id: smoke_e2e
        run: bun x playwright test --config playwright.smoke.config.ts
        env:
          CI: true
          E2E_APP_URL: https://wod.wiki

      - name: Collect smoke test stats
        id: smoke_stats
        if: always()
        run: |
          set -euo pipefail
          report="test-results/smoke-e2e-junit.xml"
          extract_attr() {
            local attr="$1"
            local file="$2"
            sed -n "s/.*${attr}=\"\\([0-9]\\+\\)\".*/\\1/p" "$file" | head -n1
          }
          if [ -f "$report" ]; then
            tests=$(extract_attr "tests" "$report")
            failures=$(extract_attr "failures" "$report")
            skipped=$(extract_attr "skipped" "$report")
          else
            tests="n/a"
            failures="n/a"
            skipped="n/a"
          fi
          echo "tests=${tests:-n/a}" >> "$GITHUB_OUTPUT"
          echo "failures=${failures:-n/a}" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped:-n/a}" >> "$GITHUB_OUTPUT"

      - name: Upload smoke test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-playwright-report
          path: playwright-report/smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload smoke test screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-e2e-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Create or update GitHub release and tag
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
            const tag = pkg.version;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;

            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
              if (ref.data.object.sha !== sha) {
                core.setFailed(`Tag ${tag} already exists at ${ref.data.object.sha}; refusing to move it.`);
                return;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha });
            }

            try {
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.updateRelease({
                owner, repo, release_id: existing.data.id, target_commitish: sha,
                name: tag, draft: false, prerelease: false,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: sha, name: tag,
                generate_release_notes: true, draft: false, prerelease: false,
              });
            }

      - name: Write release summary
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Release summary

          - Released version: $VERSION
          - Pages URL: ${{ steps.deployment.outputs.page_url }}
          - Packages: published by the wod-wiki-engine repository pipeline

          ### Smoke tests

          - Outcome: ${{ steps.smoke_e2e.outcome }}
          - Tests: ${{ steps.smoke_stats.outputs.tests }}
          - Failures: ${{ steps.smoke_stats.outputs.failures }}
          - Skipped: ${{ steps.smoke_stats.outputs.skipped }}
          EOF

