name: Release – Main

# The main-branch pipeline. Pull requests use pull-request.yml for isolated
# previews; a successful push to main publishes the production Pages artifact.
# Every push computes a version, deploys wod.wiki, creates the matching GitHub
# release, and smoke-tests the live site.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml
    secrets: inherit
    with:
      build-preview-artifact: false

  release:
    needs: [verify]
    if: needs.verify.result == 'success'
    uses: ./.github/workflows/_release.yml
    secrets: inherit

  summary:
    name: Release summary
    runs-on: ubuntu-22.04
    if: always()
    needs: [verify, release]
    steps:
      - name: Write summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Main production pipeline

          | Target | URL | Status |
          | --- | --- | --- |
          | Verify | — | ${{ needs.verify.result }} |
          | Production release | https://wod.wiki | ${{ needs.release.result }} |
          EOF
