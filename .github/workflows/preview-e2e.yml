name: Preview E2E

on:
  workflow_call:
    inputs:
      preview-url:
        description: Deployed playground base URL to test
        required: false
        type: string
        default: https://preview.wod.wiki
      branch-slug:
        description: Branch slug; when set, the HTML report is published to s3://<bucket>/<slug>/e2e-report/
        required: false
        type: string
        default: ''
      build-hash:
        description: Hashed entry-bundle fingerprint (main-<hash>.js) of the build under test; when set, the wait step polls the deployed index.html until it references this hash
        required: false
        type: string
        default: ''
    outputs:
      outcome:
        value: ${{ jobs.preview-e2e.outputs.outcome }}
      tests:
        value: ${{ jobs.preview-e2e.outputs.tests }}
      failures:
        value: ${{ jobs.preview-e2e.outputs.failures }}
      skipped:
        value: ${{ jobs.preview-e2e.outputs.skipped }}
  workflow_dispatch:
    inputs:
      preview-url:
        description: Deployed playground base URL to test
        required: false
        default: https://preview.wod.wiki
      build-hash:
        description: Optional build fingerprint for deploy-freshness gating
        required: false
        default: ''
      branch-slug:
        description: Branch slug for S3 report publishing (optional)
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preview-e2e:
    runs-on: ubuntu-22.04
    outputs:
      outcome: ${{ steps.preview_e2e.outcome }}
      tests: ${{ steps.preview_stats.outputs.tests }}
      failures: ${{ steps.preview_stats.outputs.failures }}
      skipped: ${{ steps.preview_stats.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up environment (Bun + caches + chromium)
        uses: ./.github/actions/setup-env

      # S3 sync is immediate but CloudFront may serve the previous build for
      # up to 5 minutes (max-age=300), and invalidation is best-effort. Wait
      # for the CURRENT build: when build-hash is provided, the deployed
      # index.html must reference main-<hash>.js before any test runs —
      # otherwise tests race the deploy and hit a stale or partial site.
      - name: Wait for the current build to be live
        env:
          BUILD_HASH: ${{ inputs.build-hash }}
        run: |
          set -euo pipefail
          url="${{ inputs.preview-url || 'https://preview.wod.wiki' }}"
          for i in $(seq 1 45); do
            html=$(curl -fsS "$url" 2>/dev/null || true)
            if [ -n "$html" ]; then
              if [ -z "$BUILD_HASH" ] || grep -q "main-$BUILD_HASH.js" <<<"$html"; then
                echo "preview live with current build: $url"
                exit 0
              fi
              echo "preview reachable but stale (want main-$BUILD_HASH.js) ($i/45)"
            else
              echo "waiting for $url ($i/45)"
            fi
            sleep 10
          done
          echo "::error::preview at $url did not serve build main-$BUILD_HASH.js after 7.5 minutes"
          exit 1

      # The full live-app journal suite against the deployed artifact — the
      # single e2e phase (E2E_APP_URL remote mode; no local server started).
      - name: Run live-app e2e against the deploy
        id: preview_e2e
        run: bun x playwright test --config playwright.journal.config.ts
        env:
          CI: true
          E2E_APP_URL: ${{ inputs.preview-url || 'https://preview.wod.wiki' }}

      - name: Collect preview E2E stats
        id: preview_stats
        if: always()
        run: |
          set -euo pipefail
          report="test-results/live-e2e-junit.xml"
          extract_attr() {
            local attr="$1"
            local file="$2"
            sed -n "s/.*${attr}=\"\\([0-9]\\+\\)\".*/\\1/p" "$file" | head -n1
          }
          if [ -f "$report" ]; then
            tests=$(extract_attr "tests" "$report")
            failures=$(extract_attr "failures" "$report")
            skipped=$(extract_attr "skipped" "$report")
          else
            tests="n/a"
            failures="n/a"
            skipped="n/a"
          fi
          echo "tests=${tests:-n/a}" >> "$GITHUB_OUTPUT"
          echo "failures=${failures:-n/a}" >> "$GITHUB_OUTPUT"
          echo "skipped=${skipped:-n/a}" >> "$GITHUB_OUTPUT"

      # Publishes next to the deployed preview build (<slug>/dist/), so the
      # report is browsable at <preview-url>/e2e-report/index.html.
      - name: Publish HTML report to preview S3 folder
        if: always() && inputs.branch-slug != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PREVIEW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PREVIEW_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          S3_BUCKET: ${{ secrets.AWS_PREVIEW_S3_BUCKET }}
        run: |
          set -euo pipefail
          PREFIX="${{ inputs.branch-slug }}/e2e-report/"
          echo "Publishing playwright-report/ to s3://$S3_BUCKET/$PREFIX"
          aws s3 sync playwright-report/ "s3://$S3_BUCKET/$PREFIX" \
            --delete \
            --cache-control "max-age=300, must-revalidate"

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload E2E screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-e2e-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Write preview summary
        if: always()
        env:
          BRANCH_SLUG: ${{ inputs.branch-slug }}
        run: |
          report_url=""
          if [ -n "$BRANCH_SLUG" ]; then
            if [ "$BRANCH_SLUG" = "main" ]; then
              report_url="https://e2e.wod.wiki"
            else
              report_url="https://$BRANCH_SLUG.e2e.wod.wiki"
            fi
          fi
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Live-app e2e against the deploy

          - Deploy URL: ${{ inputs.preview-url || 'https://preview.wod.wiki' }}
          - Playwright outcome: ${{ steps.preview_e2e.outcome }}
          - Tests: ${{ steps.preview_stats.outputs.tests }}
          - Failures: ${{ steps.preview_stats.outputs.failures }}
          - Skipped: ${{ steps.preview_stats.outputs.skipped }}
          EOF
          if [ -n "$report_url" ]; then
            echo "- HTML report: [$report_url]($report_url)" >> "$GITHUB_STEP_SUMMARY"
          fi
