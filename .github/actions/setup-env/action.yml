name: setup-env
description: >-
  Shared environment seam for all wod-wiki CI jobs: Bun + dependency cache +
  optional Playwright browser cache. One interface for "a ready runner" —
  cache keys and install flags live here, not in 12 copy-pasted job setups.
inputs:
  browsers:
    description: "Playwright browser set to install: 'chromium', 'all' (chromium+firefox+webkit), or '' for none"
    required: false
    default: 'chromium'
  bun-version:
    description: Bun version
    required: false
    default: '1.4.x'

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    # Restore Bun's global install cache; `bun install` on a hit is seconds,
    # not minutes. Keyed on the lockfile; fall back to any prior cache.
    - name: Restore Bun install cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Restore Playwright browser cache
      if: inputs.browsers != ''
      id: pw-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ inputs.browsers }}-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-playwright-${{ inputs.browsers }}-

    # Full install (binaries + apt deps) when the browser cache missed.
    - name: Install Playwright browsers (full, on cache miss)
      if: inputs.browsers != '' && steps.pw-cache.outputs.cache-hit != 'true'
      run: |
        if [ "${{ inputs.browsers }}" = "all" ]; then
          bun x playwright install --with-deps chromium firefox webkit
        else
          bun x playwright install --with-deps ${{ inputs.browsers }}
        fi
      shell: bash

    # Binaries are cached, but their apt system libraries are NOT — always
    # install deps, even on a cache hit. WebKit's WPE MiniBrowser needs
    # libwoff2dec & co., which are absent from the stock runner image; skip
    # this and webkit fails to launch with "error while loading shared
    # libraries". The plain install remains a no-op when binaries are
    # already restored.
    - name: Install Playwright system deps + verify browsers (on cache hit)
      if: inputs.browsers != '' && steps.pw-cache.outputs.cache-hit == 'true'
      run: |
        if [ "${{ inputs.browsers }}" = "all" ]; then
          bun x playwright install-deps chromium firefox webkit
          bun x playwright install chromium firefox webkit
        else
          bun x playwright install-deps ${{ inputs.browsers }}
          bun x playwright install ${{ inputs.browsers }}
        fi
      shell: bash
